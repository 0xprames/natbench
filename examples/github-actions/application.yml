# Copy to .github/workflows/natbench.yml in a repository with the UDP example.
# Replace the build command and scenario path when testing your own application.
name: Application connectivity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables conntrack tcpdump
      - name: Install a pinned natbench preview
        env:
          NATBENCH_VERSION: 0.2.0-alpha.1
        run: |
          cd "$(mktemp -d)"
          archive="natbench-${NATBENCH_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/0xprames/natbench/releases/download/v${NATBENCH_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 "$base/SHA256SUMS" --output SHA256SUMS
          awk -v archive="$archive" '$2 == archive {print}' SHA256SUMS > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          tar -xzf "$archive"
          sudo install -m 755 "${archive%.tar.gz}/natbench" /usr/local/bin/natbench
      - name: Build the application
        run: go build -o examples/udp-echo/udp-echo examples/udp-echo/main.go
      - name: Check host capabilities
        run: sudo natbench doctor --probe --json > natbench-doctor.json
      - name: Require application delivery in every attempt
        run: sudo natbench repeat examples/udp-echo/fixed.json --runs 3 --capture --artifacts natbench-artifacts
      - name: Make private evidence readable by the artifact uploader
        if: always()
        run: |
          if [[ -d natbench-artifacts ]]; then
            sudo chown -R -- "$(id -u):$(id -g)" natbench-artifacts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectivity-evidence
          path: |
            natbench-doctor.json
            natbench-artifacts/

name: Linux network tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables conntrack
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go build -o examples/udp-echo/udp-echo examples/udp-echo/main.go
      - run: rustc --edition 2021 -D warnings examples/udp-recovery/main.rs -o examples/udp-recovery/udp-recovery
      - run: |
          cargo fmt --check
          rustfmt --check --edition 2021 examples/udp-recovery/main.rs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sudo ./target/debug/natbench doctor --probe --json > doctor.json
      - run: sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" "NATBENCH_TEST_ARTIFACTS=$PWD/cancellation-artifacts" cargo test --locked -- --include-ignored --test-threads=1
      - run: sudo ./target/debug/natbench matrix > results.json
      - run: sudo ./target/debug/natbench test scenarios/connectivity.json --artifacts scenario-artifacts
      - run: sudo ./target/debug/natbench test examples/udp-echo/scenario.json --artifacts application-artifacts
      - run: sudo ./target/debug/natbench test examples/udp-recovery/scenario.json --artifacts recovery-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natbench-results
          path: |
            doctor.json
            results.json
            scenario-artifacts/
            cancellation-artifacts/
            application-artifacts/
            recovery-artifacts/

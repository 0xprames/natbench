name: Linux network tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - run: sudo "$(command -v python)" -m unittest discover -s tests -v
      - run: sudo "$(command -v python)" -m natbench.cli matrix > results.json
      - uses: actions/upload-artifact@v4
        with:
          name: natbench-results
          path: results.json

name: Release binaries
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables conntrack tcpdump build-essential cmake
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go build -o examples/udp-echo/udp-echo examples/udp-echo/main.go
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path crates/transport-protocol/Cargo.toml
      - run: cargo test --locked --manifest-path examples/transports/Cargo.toml --bin natbench-iroh-connectivity
      - run: cargo build --release --locked --manifest-path examples/transports/Cargo.toml
      - run: sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" "NATBENCH_TEST_ARTIFACTS=$PWD/cancellation-artifacts" cargo test --locked -- --include-ignored --test-threads=1
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Require a version-matching release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          test "$(./target/$TARGET/release/natbench --version)" = "natbench ${RELEASE_TAG#v}"
          git merge-base --is-ancestor HEAD origin/main
      - name: Package binary and verify checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/package-release.sh "target/$TARGET/release/natbench" "$TARGET" dist examples/transports/target/release
          cd dist
          sha256sum --check *.sha256
      - name: Exercise the extracted archive
        run: |
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          binary=$(find "$PWD/extracted" -name natbench -type f)
          scenario=$(find "$PWD/extracted" -name connectivity.json -type f)
          "$binary" --version
          "$binary" --help
          sudo "$binary" doctor --probe --json > doctor.json
          sudo "$binary" test "$scenario" --artifacts packaged-scenario > packaged-report.json
          sudo "$binary" test examples/udp-echo/scenario.json --capture --artifacts application-artifacts > application-report.json
          bundle=$(dirname "$binary")
          # Exercise the bundled programs without Rust on the runtime PATH.
          if env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash -c 'command -v cargo || command -v rustc'; then
            echo "Runtime smoke test requires a PATH without Rust" >&2
            exit 1
          fi
          sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin "$binary" compare "$bundle/examples/transports/direct.json" --runs 2 --capture --artifacts bundled-comparison-artifacts > bundled-comparison-report.json
          sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin "$bundle/scripts/check-transport-comparison.sh" "$binary" "$bundle/bin/natbench-transport-adapters" transport-comparison-artifacts
          sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin "$bundle/scripts/check-iroh-connectivity.sh" "$binary" "$bundle/bin/natbench-iroh-connectivity" iroh-connectivity-artifacts
          # Included source still rebuilds independently from the controller.
          cargo build --release --locked --manifest-path "$bundle/examples/transports/Cargo.toml" --target-dir "$PWD/examples/transports/target"
          go build -o "$bundle/examples/udp-echo/udp-echo" "$bundle/examples/udp-echo/main.go"
          sudo "$bundle/scripts/check-application-demo.sh" "$binary" diagnostic-demo-artifacts
          rustc --edition 2021 -D warnings "$bundle/examples/udp-recovery/main.rs" -o "$bundle/examples/udp-recovery/udp-recovery"
          sudo "$binary" test "$bundle/examples/udp-recovery/scenario.json" --artifacts recovery-artifacts > recovery-report.json
          sudo "$binary" repeat "$bundle/examples/udp-recovery/scenario.json" --runs 2 --capture --artifacts repetition-artifacts > repetition-report.json
      - name: Allow the runner to read private packet evidence
        if: always()
        run: |
          for directory in application-artifacts repetition-artifacts diagnostic-demo-artifacts transport-comparison-artifacts iroh-connectivity-artifacts bundled-comparison-artifacts; do
            if [[ -d "$directory" ]]; then
              sudo chown -R -- "$(id -u):$(id -g)" "$directory"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: |
            doctor.json
            packaged-report.json
            packaged-scenario/
            cancellation-artifacts/
            application-artifacts/
            application-report.json
            recovery-artifacts/
            recovery-report.json
            repetition-artifacts/
            repetition-report.json
            diagnostic-demo-artifacts/
            bundled-comparison-artifacts/
            bundled-comparison-report.json
            transport-comparison-artifacts/
            iroh-connectivity-artifacts/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          notes="$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"
          args=(--verify-tag)
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" *.tar.gz SHA256SUMS

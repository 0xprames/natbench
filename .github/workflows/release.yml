name: Release binaries
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables conntrack build-essential cmake
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go build -o examples/udp-echo/udp-echo examples/udp-echo/main.go
      - run: cargo test --locked
      - run: sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" "NATBENCH_TEST_ARTIFACTS=$PWD/cancellation-artifacts" cargo test --locked -- --include-ignored --test-threads=1
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Require a version-matching release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          test "$(./target/$TARGET/release/natbench --version)" = "natbench ${RELEASE_TAG#v}"
          git merge-base --is-ancestor HEAD origin/main
      - name: Package binary and verify checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/package-release.sh "target/$TARGET/release/natbench" "$TARGET" dist
          cd dist
          sha256sum --check *.sha256
      - name: Exercise the extracted archive
        run: |
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          binary=$(find "$PWD/extracted" -name natbench -type f)
          scenario=$(find "$PWD/extracted" -name connectivity.json -type f)
          "$binary" --version
          "$binary" --help
          sudo "$binary" doctor --probe --json > doctor.json
          sudo "$binary" test "$scenario" --artifacts packaged-scenario > packaged-report.json
          sudo "$binary" test examples/udp-echo/scenario.json --artifacts application-artifacts > application-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: |
            doctor.json
            packaged-report.json
            packaged-scenario/
            cancellation-artifacts/
            application-artifacts/
            application-report.json
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease *.tar.gz SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes *.tar.gz SHA256SUMS
          fi

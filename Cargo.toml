[package]
name = "natbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Measure NAT behavior, UDP traversal, and relay recovery in isolated Linux networks"
repository = "https://github.com/0xprames/natbench"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = "0.5"

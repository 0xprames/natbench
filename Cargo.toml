[package]
name = "natbench"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Measure NAT behavior, UDP traversal, and relay recovery in isolated Linux networks"
repository = "https://github.com/0xprames/natbench"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = "0.5"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
